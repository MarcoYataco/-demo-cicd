name: CI/CD - Demo Guestbook

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint - Code and Dockerfiles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix api

      - name: Run ESLint and HTMLHint
        run: npm run lint

      - name: Lint Dockerfiles with Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
        with:
          dockerfile: Dockerfile
          recursive: true

  sast:
    name: SAST - Semgrep and Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            semgrep/semgrep:1.180.0 \
            semgrep scan \
            --config p/ci \
            --config p/dockerfile \
            --error

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect \
            --source . \
            --redact \
            --exit-code 1

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix api

      - name: Run unit tests
        run: npm run test:unit

      - name: Run site tests
        run: npm run test:site

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix api

      - name: Start Docker Compose services
        run: |
          DB_PASSWORD="$(openssl rand -hex 24)"
          printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD" > .env
          docker compose up -d --build --wait

      - name: Run integration tests
        run: npm run test:integration

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v

  package:
    name: Package - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test-integration, sast]

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service: [web, api, db]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/marcoyataco/demo-cicd-${{ matrix.service }}:sha-${{ github.sha }}

  security:
    name: Security - Trivy - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: package

    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        service: [web, api, db]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for pull requests
        if: github.event_name == 'pull_request'
        run: |
          docker build \
            -t demo-cicd-${{ matrix.service }}:pr \
            ./${{ matrix.service }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ github.event_name == 'pull_request' && format('demo-cicd-{0}:pr', matrix.service) || format('ghcr.io/marcoyataco/demo-cicd-{0}:sha-{1}', matrix.service, github.sha) }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: false

  deploy-dev:
    name: Deploy DEV - Kubernetes and smoke tests
    runs-on: ubuntu-latest
    needs: security
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    environment: dev

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create DEV cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa
        with:
          cluster_name: dev

      - name: Create namespace and temporary secrets
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl create namespace demo-dev
          kubectl -n demo-dev create secret docker-registry ghcr \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_PASSWORD"
          kubectl -n demo-dev create secret generic db-credenciales \
            --from-literal=DB_PASSWORD="$(openssl rand -hex 24)"

      - name: Deploy scanned images
        run: |
          bash scripts/desplegar.sh \
            k8s/overlays/dev \
            ghcr.io/marcoyataco/demo-cicd \
            "sha-${{ github.sha }}"

      - name: Wait for rollout
        run: |
          kubectl -n demo-dev rollout status deploy/db --timeout=180s
          kubectl -n demo-dev rollout status deploy/api --timeout=180s
          kubectl -n demo-dev rollout status deploy/web --timeout=180s

      - name: Run smoke and integration tests against DEV
        run: |
          kubectl -n demo-dev port-forward svc/web 8080:80 > /tmp/dev-port-forward.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 2 \
            --fail --silent --show-error http://localhost:8080/api/health
          bash scripts/smoke.sh http://localhost:8080
          APP_URL=http://localhost:8080 npm run test:integration

      - name: Show diagnostics on failure
        if: failure()
        run: |
          kubectl -n demo-dev get all
          kubectl -n demo-dev describe pods
          kubectl -n demo-dev logs -l app=api --all-containers --tail=50 || true
          kubectl -n demo-dev logs -l app=db --all-containers --tail=50 || true

      - name: Delete temporary DEV cluster
        if: always()
        run: kind delete cluster --name dev

  deploy-staging:
    name: Deploy STAGING - Manual approval
    needs: deploy-dev
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64, staging]

    environment:
      name: staging
      url: http://localhost:30080

    permissions:
      contents: read

    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Deploy the same images tested in DEV
        run: |
          bash scripts/desplegar.sh \
            k8s/overlays/staging \
            ghcr.io/marcoyataco/demo-cicd \
            "sha-${{ github.sha }}"

      - name: Wait for rollout
        run: |
          kubectl -n demo-staging rollout status deploy/db --timeout=180s
          kubectl -n demo-staging rollout status deploy/api --timeout=180s
          kubectl -n demo-staging rollout status deploy/web --timeout=180s

      - name: Run smoke test
        run: bash scripts/smoke.sh http://localhost:30080

      - name: Show diagnostics on failure
        if: failure()
        run: |
          kubectl -n demo-staging get all
          kubectl -n demo-staging describe pods
          kubectl -n demo-staging logs -l app=api --all-containers --tail=50 || true
          kubectl -n demo-staging logs -l app=db --all-containers --tail=50 || true